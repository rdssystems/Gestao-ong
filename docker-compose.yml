services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: gestao_ong
      POSTGRES_PASSWORD: "@Slipknot12"
      POSTGRES_DB: gestao_ong
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestao_ong"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./app_src
      target: runner
    restart: always
    ports:
      - "3005:3000"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      DATABASE_URL: postgresql://gestao_ong:%40Slipknot12@postgres:5432/gestao_ong
      NEXTAUTH_SECRET: "f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0"
      NEXTAUTH_URL: https://servidor-qualificacao.tailbeb7d5.ts.net:8443
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
